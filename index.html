<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111318" />
    <title>Rep Tracker</title>
  </head>
  <body>
    <section id="auth" data-controller="auth" hidden>
      <div class="card auth-card">
        <h1>Rep Tracker</h1>
        <p class="muted">Track your pushups, pages read, and more. Sign in with a magic link — no password needed.</p>
        <form data-action="submit->auth#send">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
            data-auth-target="email"
          />
          <button type="submit" class="primary" data-auth-target="submit">Send magic link</button>
        </form>
        <form data-action="submit->auth#verify" data-auth-target="codeForm" hidden>
          <label for="otp-code">Or paste the sign-in link (long-press it → Copy Link)</label>
          <div class="inline-form">
            <input
              id="otp-code"
              autocomplete="one-time-code"
              placeholder="Paste link or 6-digit code"
              required
              data-auth-target="code"
            />
            <button type="submit">Verify</button>
          </div>
        </form>
        <p class="status" role="status" data-auth-target="status"></p>
      </div>
    </section>

    <main id="app" data-controller="activities" hidden>
      <header class="app-header">
        <h1>Rep Tracker</h1>
        <button type="button" id="signout" class="ghost">Sign out</button>
      </header>

      <div data-controller="dashboard">
        <section class="card">
          <p class="nudge" data-dashboard-target="nudge" hidden></p>
          <div class="card-head">
            <h2>Today</h2>
            <span class="muted small" data-dashboard-target="grandTotal" hidden></span>
          </div>
          <div class="hero">
            <div class="rings" data-dashboard-target="rings" hidden></div>
            <div class="today-rows" data-dashboard-target="today"></div>
          </div>
        </section>

        <section class="card" data-controller="chart">
          <h2 data-chart-target="heading">Last 30 days</h2>
          <div class="chart-wrap">
            <div data-chart-target="container"></div>
            <div class="chart-tooltip" data-chart-target="tooltip" hidden></div>
          </div>
        </section>

        <section class="card">
          <h2>Recent</h2>
          <ul class="entries" data-dashboard-target="list"></ul>
          <p class="muted" data-dashboard-target="empty">Nothing logged yet.</p>
        </section>
      </div>

      <button type="button" id="open-log" class="fab" aria-label="Log activity">＋</button>

      <dialog id="log-sheet" class="sheet">
        <div class="sheet-head">
          <h2>Log</h2>
          <button type="button" id="close-log" class="ghost" aria-label="Close">✕</button>
        </div>

        <section data-controller="logger">
          <label for="activity-picker">Activity</label>
          <select
            id="activity-picker"
            data-activities-target="picker"
            data-logger-target="picker"
            data-action="change->activities#select"
          ></select>

          <div data-logger-target="counted">
            <div class="quick-row">
              <button type="button" class="quick" data-action="logger#quick" data-logger-reps-param="5">+5</button>
              <button type="button" class="quick" data-action="logger#quick" data-logger-reps-param="10">+10</button>
              <button type="button" class="quick" data-action="logger#quick" data-logger-reps-param="15">+15</button>
              <button type="button" class="quick" data-action="logger#quick" data-logger-reps-param="20">+20</button>
            </div>

            <form class="inline-form" data-action="submit->logger#add">
              <input
                type="number"
                min="1"
                max="10000"
                inputmode="numeric"
                placeholder="Reps"
                required
                aria-label="Reps"
                data-logger-target="input"
              />
              <button type="submit" class="primary">Log</button>
            </form>
          </div>

          <button
            type="button"
            class="primary habit-mark"
            data-logger-target="habitButton"
            data-action="logger#markDone"
            hidden
          >
            Mark today done ✓
          </button>

          <details
            class="backdate"
            data-logger-target="details"
            data-action="toggle->logger#toggleBackdate"
          >
            <summary>Log a past day</summary>
            <label for="log-date">Date</label>
            <input id="log-date" type="date" data-logger-target="date" />
            <p class="muted small">While a date is set, every log above is saved to that day.</p>
          </details>
          <p class="status" role="status" data-logger-target="status"></p>
        </section>

        <details class="backdate">
          <summary>Add an activity</summary>
          <form data-action="submit->activities#create">
            <input
              id="new-activity"
              type="text"
              maxlength="60"
              placeholder="e.g. Dune, Pickleball"
              required
              aria-label="Name"
              data-activities-target="name"
            />
            <div class="inline-form">
              <select
                aria-label="Kind"
                class="unit-select"
                data-activities-target="kind"
                data-action="change->activities#kindChanged"
              >
                <option value="exercise" selected>exercise</option>
                <option value="book">book</option>
                <option value="habit">habit (yes/no)</option>
              </select>
              <select aria-label="Unit" class="unit-select" data-activities-target="unit"></select>
              <button type="submit" class="grow">Add</button>
            </div>
            <p class="status" role="status" data-activities-target="status"></p>
          </form>
        </details>
      </dialog>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
